# Chtholly Hub 单机生产 Compose
# 用法见 docker/README.md — 部署章节

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=200
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-${MYSQL_PASSWORD:?set MYSQL_ROOT_PASSWORD or MYSQL_PASSWORD in .env}}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chtholly}
      MYSQL_USER: ${MYSQL_USER:-chtholly}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init-user.sh:/docker-entrypoint-initdb.d/02-init-user.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-${MYSQL_PASSWORD}}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512M

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.1
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      cluster.routing.allocation.disk.watermark.low: 95%
      cluster.routing.allocation.disk.watermark.high: 97%
      cluster.routing.allocation.disk.watermark.flood_stage: 99%
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  kafka:
    image: apache/kafka:4.2.0
    profiles: ["kafka"]
    restart: unless-stopped
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  server:
    build:
      context: ./apps/server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false
    environment:
      SERVER_PORT: 8888
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-llm}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chtholly}
      MYSQL_USER: ${MYSQL_USER:-chtholly}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      ES_URIS: http://elasticsearch:9200
      ES_REPLICAS: ${ES_REPLICAS:-0}
      CANAL_ENABLED: ${CANAL_ENABLED:-false}
      CANAL_PASSWORD: ${CANAL_PASSWORD:-}
      COUNTER_KAFKA_PUBLISH_MAX_ATTEMPTS: ${COUNTER_KAFKA_PUBLISH_MAX_ATTEMPTS:-3}
      COUNTER_KAFKA_PUBLISH_ACK_TIMEOUT: ${COUNTER_KAFKA_PUBLISH_ACK_TIMEOUT:-PT3S}
      COUNTER_KAFKA_CONSUMER_MAX_ATTEMPTS: ${COUNTER_KAFKA_CONSUMER_MAX_ATTEMPTS:-3}
      COUNTER_KAFKA_CONSUMER_RETRY_BACKOFF: ${COUNTER_KAFKA_CONSUMER_RETRY_BACKOFF:-PT1S}
      COUNTER_KAFKA_CONSUMER_DLT_ACK_TIMEOUT: ${COUNTER_KAFKA_CONSUMER_DLT_ACK_TIMEOUT:-PT3S}
      COUNTER_CALIBRATION_ENABLED: ${COUNTER_CALIBRATION_ENABLED:-true}
      COUNTER_CALIBRATION_FIXED_DELAY: ${COUNTER_CALIBRATION_FIXED_DELAY:-PT5M}
      COUNTER_CALIBRATION_BATCH_SIZE: ${COUNTER_CALIBRATION_BATCH_SIZE:-50}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-deepseek-chat}
      AGENT_LLM_TIMEOUT_SECONDS: ${AGENT_LLM_TIMEOUT_SECONDS:-30}
      AGENT_MAX_RESPONSE_CHARS: ${AGENT_MAX_RESPONSE_CHARS:-2000}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-10}
      AGENT_MEMORY_MAX_TURNS: ${AGENT_MEMORY_MAX_TURNS:-20}
      AGENT_MEMORY_TTL_MINUTES: ${AGENT_MEMORY_TTL_MINUTES:-120}
      AGENT_TOOL_TIMEOUT_SECONDS: ${AGENT_TOOL_TIMEOUT_SECONDS:-30}
      AGENT_TURN_TIMEOUT_SECONDS: ${AGENT_TURN_TIMEOUT_SECONDS:-60}
      SITE_OWNER_USER_ID: ${SITE_OWNER_USER_ID:-1}
      CHTHOLLY_USER_ID: ${CHTHOLLY_USER_ID:-888888888888888888}
      OWNER_BOOTSTRAP_PASSWORD: ${OWNER_BOOTSTRAP_PASSWORD:-}
      OWNER_HANDLE: ${OWNER_HANDLE:-Rekyrice}
      OWNER_NICKNAME: ${OWNER_NICKNAME:-Rekyrice}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_PUBLIC_DOMAIN: ${OSS_PUBLIC_DOMAIN:-}
      OSS_FOLDER: ${OSS_FOLDER:-post}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH:-/app/uploads}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      BANGUMI_ENABLED: ${BANGUMI_ENABLED:-true}
      BANGUMI_ACCESS_TOKEN: ${BANGUMI_ACCESS_TOKEN:-}
      BANGUMI_SYNC_ENABLED: ${BANGUMI_SYNC_ENABLED:-false}
      AUTH_JWT_PRIVATE_KEY: file:/run/secrets/jwt-private.pem
      AUTH_JWT_PUBLIC_KEY: file:/run/secrets/jwt-public.pem
    volumes:
      - uploads_data:/app/uploads
      - ./.production-secrets/jwt-private.pem:/run/secrets/jwt-private.pem:ro
      - ./.production-secrets/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8888/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  web:
    build:
      context: ./apps/web
      args:
        API_SERVER_URL: http://server:8888
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_OSS_PUBLIC_URL: ${NEXT_PUBLIC_OSS_PUBLIC_URL}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      API_SERVER_URL: http://server:8888
      PORT: 3000
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${NGINX_CONFIG_PATH:-./docker/nginx/default.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./.production-secrets/acme-webroot:/var/www/certbot:ro
      - ./.production-secrets/letsencrypt:/etc/letsencrypt:ro
      - uploads_data:/app/uploads:ro
    depends_on:
      web:
        condition: service_healthy
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mysql_data:
  redis_data:
  es_data:
  uploads_data:
